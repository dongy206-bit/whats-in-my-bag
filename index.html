<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MY BAG</title>
        <link rel="stylesheet" href="bag.css">
    </head>
    <body>
        <h1 id="top">MY BAG</h1>
        <p>nine objects, one bag.
        <br><br>
        <a href="#essentials">musts</a>
        <a href="#tech">tech</a>
        <a href="#care">self care</a>
        </p>

        <p>scroll to take a look, or jump to exactly what you're looking for</p>
        
        <hr>

        <h2 id="essentials">musts</h2>

        <div>
            <h3>keys</h3>
            <img id="keys" src="keys.png" alt="Keys">
        </div>

        <div>
            <h3>wallet</h3>
            <img id="wallet" src="Card holder.png" alt="Card holder">
        </div>

        <div>
            <h3>pencil case</h3>
            <img id="pencilcase" src="Pencil case.png" alt="Pencil Case">
        </div>

        <h2 id="tech">tech</h2>

        <div>
            <h3>laptop</h3>
            <img id="laptop" src="Laptop.png" alt="Laptop">
        </div>

        <div>
            <h3>airpods</h3>
            <img id="airpods" src="Airpods.png" alt="Airpods">
        </div>

        <h2 id="care">self care</h2>

        <div>
            <h3>lip gloss</h3>
            <img id="lipgloss" src="Lip gloss.png" alt="Lip Gloss">
        </div>

        <div>
            <h3>hand sanitizer</h3>
            <img id="handsanitizer" src="Hand sanitizer.png" alt="Hand Sanitizer">
        </div>

        <div>
            <h3>water bottle</h3>
            <img id="waterbottle" src="Water bottle.png" alt="Water Bottle">
        </div>

        <div>
            <h3>hair tie</h3>
            <img id="hairtied" src="Hair ties.png" alt="Hair Ties">
        </div>

        <p><a href="#top">all the way up</a></p>
    </body>
</html>
